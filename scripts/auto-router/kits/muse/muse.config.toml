# Copy to ~/.codex/muse.config.toml and run `codex --profile muse` (needs MODEL_API_KEY).
# Codex layers a profile on top of ~/.codex/config.toml, so settings there (including
# [agents] subagent defaults) still apply unless overridden here.
model_provider = "muse"
model = "muse-spark-1.3"
model_reasoning_effort = "medium"

# Named "muse" rather than "meta" so it does not merge into a "meta" provider you may
# already have in config.toml.
[model_providers.muse]
name = "Meta Model API"
base_url = "https://api.meta.ai/v1"
env_key = "MODEL_API_KEY"
wire_api = "responses"

# No [agents] subagent defaults here: Codex validates them against its own model
# catalog, which has no Muse entry, so spawned subagents would fail to start.
# Without them, subagents inherit this session's model. If your base config.toml sets
# [agents] defaults for ChatGPT models, remove them before using this profile.
