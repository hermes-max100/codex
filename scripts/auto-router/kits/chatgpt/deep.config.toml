# Copy to ~/.codex/deep.config.toml and run `codex --profile deep` for hard sessions.
# A profile file replaces config.toml for that run, so it must be complete on its own.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
